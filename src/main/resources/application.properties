spring.application.name=WuFei-backend

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/wu_fei_city?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.whu.wufeibackend.entity
mybatis.configuration.map-underscore-to-camel-case=true

# JWT配置
jwt.secret=wuFeiCitySecretKey2024301015555555
jwt.expiration=6000000

# 服务器配置
server.port=8080

# 日志配置
logging.level.root=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.com.whu.wufeibackend=DEBUG
logging.level.org.springframework=DEBUG

# 启用Spring Boot全局debug模式
debug=true

# 测试模式配置
# 是否启用测试模式（可以模拟当前时间）
app.test-mode.enabled=true
# 模拟的当前时间（ISO 8601格式）如果不设置则使用真实时间
app.test-mode.mock-current-time=2024-12-01T10:00:00

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs